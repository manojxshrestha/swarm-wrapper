[project]
name = "swarm-server"
version = "0.1.0"
description = "OWASP WSTG knowledge base MCP server for AI-driven penetration testing"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "cvss>=3.6",
    "browser-use[core]>=0.1.0",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
encrypt = []

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.10"
strict = false
disable_error_code = [
    "import-untyped",
    "no-untyped-call",
    "no-untyped-def",
    "attr-defined",
    "operator",
    "type-var",
    "misc",
    "var-annotated",
]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_configs = true
exclude = [
    "data/",
    "engagements/",
    "scripts/",
]

[tool.ruff]
target-version = "py310"
line-length = 210

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E741"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 210
target-version = ["py310"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
