# End-to-end lab targets for Swarm (Phase 1).
#   vuln   → intentionally vulnerable server (planted bugs to find)
#   httpbin → benign control (must yield zero false positives)
services:
  vuln:
    build:
      context: .
      dockerfile: Dockerfile.vuln
    ports:
      - "3000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/safe?q=ok')"]
      interval: 5s
      timeout: 3s
      retries: 10

  httpbin:
    image: kennethreitz/httpbin:latest
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/status/200"]
      interval: 5s
      timeout: 3s
      retries: 30
