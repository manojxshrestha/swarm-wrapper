name: Lab + Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server deps
        working-directory: server
        run: |
          pip install hatchling
          pip install -e ".[dev]"
      - name: FP/FN benchmark (gate precision >= 0.90)
        run: pytest tests/benchmark/ -q -s

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server deps
        working-directory: server
        run: |
          pip install hatchling
          pip install -e ".[dev]"
      - name: End-to-end lab (juice-shop + httpbin via docker compose)
        run: pytest tests/lab/ -q -s

  bash-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash regression tests
        run: |
          for t in scripts/tests/*.sh; do echo "== $t"; bash "$t" || exit 1; done
