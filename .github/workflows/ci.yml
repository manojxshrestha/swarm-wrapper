name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: server
        run: |
          pip install hatchling
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check server/
      - name: Black
        run: black --check server/
      - name: Mypy
        working-directory: server
        run: mypy .
      - name: Bandit (security)
        working-directory: server
        run: bandit -r . --skip=B101,B102,B104,B105,B106,B107,B108,B110,B112,B113,B202,B301,B303,B305,B307,B310,B311,B324,B403,B404,B501,B602,B603,B604,B606,B607,B608,B610 -x data/,engagements/,tests/,venv/
      - name: Safety (dependencies)
        continue-on-error: true
        run: |
          pip install --upgrade pip
          pip-audit --local
      - name: Validate agent files
        run: python scripts/tools/agent_tools.py --validate

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: server
        run: |
          pip install hatchling
          pip install -e ".[dev]"
      - name: Test with pytest
        working-directory: server
        run: pytest --cov=. --cov-report=term-missing
